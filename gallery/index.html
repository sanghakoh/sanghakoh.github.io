</style> <h2 id="cisc-w-2026">CISC-W 2026</h2> <div class="gallery-grid"> <img src="/assets/img/gallery/cisc-2026w/1.jpg" alt="CISC-W 2026 1" loading="lazy"> <img src="/assets/img/gallery/cisc-2026w/2.jpg" alt="CISC-W 2026 2" loading="lazy"> <img src="/assets/img/gallery/cisc-2026w/3.jpg" alt="CISC-W 2026 3" loading="lazy"> <img src="/assets/img/gallery/cisc-2026w/4.jpg" alt="CISC-W 2026 4" loading="lazy"> <img src="/assets/img/gallery/cisc-2026w/5.jpg" alt="CISC-W 2026 5" loading="lazy"> </div> <div class="lightbox" id="lightbox" aria-hidden="true"> <button class="lb-close" aria-label="Close">×</button> <button class="lb-btn lb-prev" aria-label="Previous">❮</button> <img class="lb-img" src="" alt=""> <button class="lb-btn lb-next" aria-label="Next">❯</button> <div class="lb-caption"></div> </div> <script>
  (function () {
    function initGallery() {
      var lb = document.getElementById("lightbox");
      if (!lb) return;
      var lbImg = lb.querySelector(".lb-img");
      var lbCap = lb.querySelector(".lb-caption");
      var group = [], idx = 0;

      function show(i) {
        if (!group.length) return;
        idx = (i + group.length) % group.length;
        lbImg.src = group[idx].src;
        lbImg.alt = group[idx].alt || "";
        lbCap.textContent = (group[idx].alt ? group[idx].alt + "   " : "") + "(" + (idx + 1) + " / " + group.length + ")";
      }
      function open(g, i) { group = g; lb.classList.add("open"); document.body.style.overflow = "hidden"; show(i); }
      function close() { lb.classList.remove("open"); document.body.style.overflow = ""; }

      document.querySelectorAll(".gallery-grid").forEach(function (grid) {
        var imgs = Array.prototype.slice.call(grid.querySelectorAll("img"));
        var g = imgs.map(function (im) { return { src: im.getAttribute("src"), alt: im.getAttribute("alt") }; });
        imgs.forEach(function (im, i) { im.addEventListener("click", function () { open(g, i); }); });
      });

      lb.querySelector(".lb-next").addEventListener("click", function (e) { e.stopPropagation(); show(idx + 1); });
      lb.querySelector(".lb-prev").addEventListener("click", function (e) { e.stopPropagation(); show(idx - 1); });
      lb.querySelector(".lb-close").addEventListener("click", function (e) { e.stopPropagation(); close(); });
      lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "ArrowRight") show(idx + 1);
        else if (e.key === "ArrowLeft") show(idx - 1);
        else if (e.key === "Escape") close();
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initGallery);
    else initGallery();
  })();
